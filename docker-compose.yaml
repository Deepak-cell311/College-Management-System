services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000" # Ports must be a list, even if there's only one port mapping
    environment:
      REACT_APP_RAZORPAY_KEY_ID: ${REACT_APP_RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      BACKEND_URL: ${BACKEND_URL}

    restart: always

    networks:
      - app-network

  server:
    build: ./server
    ports:
      - "5000:5000" # Ports must be a list, even if there's only one port mapping
    environment:
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      MONGO_URL: ${MONGO_URL}
      PORT: ${PORT}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      JWT_SECRET: ${JWT_SECRET}

    restart: always
networks:
  app-network:
    driver: bridge
